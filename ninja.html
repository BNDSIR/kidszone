<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Balloon Ninja Number Learner | বেলুন নিনজা সংখ্যা শিক্ষা</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Atma:wght@500;600;700&family=Fredoka:wght@400;600;700&family=Hind+Siliguri:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  
  html, body {
    width: 100%;
    height: 100%;
    height: 100dvh;
    overflow: hidden;
    background-color: #0f172a;
    font-family: 'Hind Siliguri', 'Inter', sans-serif;
    touch-action: none;
    position: fixed;
  }

  canvas#gameCanvas {
    display: block;
    width: 100vw;
    height: 100dvh;
    touch-action: none;
    background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
  }

  /* Custom scrollbar for settings modal */
  .custom-scrollbar::-webkit-scrollbar {
    width: 6px;
  }
  .custom-scrollbar::-webkit-scrollbar-track {
    background: rgba(255, 255, 255, 0.05);
    border-radius: 8px;
  }
  .custom-scrollbar::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.2);
    border-radius: 8px;
  }
</style>
</head>
<body class="bg-slate-900 text-white overflow-hidden select-none">

  <!-- Main Game Canvas -->
  <canvas id="gameCanvas"></canvas>

  <!-- HUD Overlay -->
  <div id="hud" class="absolute top-0 left-0 w-full p-4 flex justify-between items-start pointer-events-none z-10">
    <!-- Score & Target Banner -->
    <div class="flex flex-col gap-2">
      <div class="bg-slate-800/80 backdrop-blur border border-slate-700/60 rounded-2xl p-3 px-5 shadow-xl flex items-center gap-4">
        <div>
          <div class="text-xs uppercase tracking-wider text-slate-400 font-semibold" id="targetLabel">খুঁজে বের করো (Find)</div>
          <div class="text-3xl sm:text-4xl font-extrabold text-amber-400 drop-shadow" id="targetDisplay">১ (1)</div>
        </div>
      </div>

      <!-- Knife Health / Durability Bar -->
      <div class="bg-slate-800/80 backdrop-blur border border-slate-700/60 rounded-xl p-2.5 px-4 shadow-lg flex items-center gap-3">
        <div class="text-xs font-bold text-slate-300" id="durabilityLabel">ছুরির ধার:</div>
        <div class="flex items-center gap-1.5" id="knifeDurabilityIcons">
          <!-- Dynamically populated durability icons -->
        </div>
      </div>
    </div>

    <!-- Controls & Score -->
    <div class="flex items-center gap-3 pointer-events-auto">
      <div class="bg-slate-800/80 backdrop-blur border border-slate-700/60 rounded-2xl p-3 px-5 text-right shadow-xl">
        <div class="text-xs uppercase tracking-wider text-slate-400 font-semibold" id="scoreLabel">স্কোর</div>
        <div class="text-2xl sm:text-3xl font-extrabold text-emerald-400" id="scoreDisplay">০</div>
      </div>

      <button id="btnSettings" class="bg-slate-800/80 hover:bg-slate-700 border border-slate-700/60 text-white p-3.5 rounded-2xl shadow-xl transition active:scale-95">
        <i class="fas fa-cog text-xl"></i>
      </button>
    </div>
  </div>

  <!-- Giant Speech Pronunciation Banner Popup -->
  <div id="speechBanner" class="absolute top-28 left-1/2 -translate-x-1/2 bg-amber-500/90 text-slate-950 font-black px-8 py-4 rounded-3xl shadow-2xl border-4 border-amber-300 text-2xl sm:text-4xl text-center transform -translate-y-8 opacity-0 transition-all duration-300 pointer-events-none z-20">
    <span id="speechBannerText">এক দশ এক - এগারো</span>
  </div>

  <!-- Start / Game Over Screen Overlay -->
  <div id="startOverlay" class="absolute inset-0 bg-slate-950/80 backdrop-blur-md flex flex-col items-center justify-center p-6 z-30">
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl text-center flex flex-col items-center">
      <div class="w-20 h-20 bg-amber-500/20 text-amber-400 rounded-3xl flex items-center justify-center text-4xl mb-4 border border-amber-500/30 shadow-inner">
        <i class="fas fa-balloon"></i>
      </div>
      <h1 class="text-3xl font-black text-white mb-2" id="gameTitle">সংখ্যা শেখা বেলুন খেলা</h1>
      <p class="text-slate-400 text-sm mb-6" id="gameSubtitle">সঠিক সংখ্যার বেলুনটি কেটে সঠিক উত্তর দাও!</p>

      <button id="btnStartGame" class="w-full bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 text-slate-950 font-extrabold text-xl py-4 rounded-2xl shadow-lg transition transform active:scale-95 mb-3 flex items-center justify-center gap-3">
        <i class="fas fa-play"></i> <span id="btnStartText">খেলা শুরু করুন</span>
      </button>
      
      <button id="btnOpenSettingsInit" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-3 rounded-2xl transition active:scale-95 border border-slate-700 flex items-center justify-center gap-2">
        <i class="fas fa-sliders-h"></i> <span id="btnSettingsText">সেটিংস পরিবর্তন</span>
      </button>
    </div>
  </div>

  <!-- Reward / Victory Modal -->
  <div id="victoryModal" class="hidden absolute inset-0 bg-slate-950/85 backdrop-blur-md flex flex-col items-center justify-center p-6 z-40">
    <div class="max-w-md w-full bg-slate-900 border border-amber-500/40 rounded-3xl p-8 shadow-2xl text-center flex flex-col items-center animate-bounce-short">
      <div class="text-6xl mb-3">🏆</div>
      <h2 class="text-3xl font-extrabold text-amber-400 mb-2" id="victoryTitle">দারুণ কাজ!</h2>
      <p class="text-slate-300 text-base mb-6" id="victoryMsg">তুমি সবকটি বেলুন সঠিকভাবে ফাটিয়েছো!</p>
      
      <button id="btnRestartVictory" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold text-xl py-4 rounded-2xl shadow-lg transition transform active:scale-95 flex items-center justify-center gap-2">
        <i class="fas fa-redo"></i> <span id="btnRestartText">আবার খেলুন</span>
      </button>
    </div>
  </div>

  <!-- Settings Modal -->
  <div id="settingsModal" class="hidden absolute inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 z-50">
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl flex flex-col max-h-[90vh]">
      <div class="flex justify-between items-center mb-5 border-b border-slate-800 pb-3">
        <h2 class="text-xl font-bold text-white flex items-center gap-2">
          <i class="fas fa-cog text-amber-400"></i> <span id="settingsTitle">গেমিং সেটিংস</span>
        </h2>
        <button id="btnCloseSettings" class="text-slate-400 hover:text-white p-2">
          <i class="fas fa-times text-xl"></i>
        </button>
      </div>

      <div class="space-y-5 overflow-y-auto pr-1 custom-scrollbar flex-1">
        <!-- Language Switch -->
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2" id="langSettingLabel">ভাষা (Language)</label>
          <div class="grid grid-cols-2 gap-3">
            <button id="langBnBtn" class="py-2.5 rounded-xl font-bold border border-amber-500 bg-amber-500/20 text-amber-300">বাংলা</button>
            <button id="langEnBtn" class="py-2.5 rounded-xl font-bold border border-slate-700 bg-slate-800 text-slate-400">English</button>
          </div>
        </div>

        <!-- Number Range Settings -->
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2" id="rangeSettingLabel">সংখ্যার সীমা (Number Range)</label>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <span class="text-xs text-slate-400 mb-1 block" id="minNumLabel">সর্বনিম্ন</span>
              <input type="number" id="inputMinNum" value="1" min="1" max="999" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white font-bold focus:outline-none focus:border-amber-500">
            </div>
            <div>
              <span class="text-xs text-slate-400 mb-1 block" id="maxNumLabel">সর্বোচ্চ</span>
              <input type="number" id="inputMaxNum" value="10" min="1" max="1000" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white font-bold focus:outline-none focus:border-amber-500">
            </div>
          </div>
        </div>

        <!-- Sequence Mode -->
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2" id="patternSettingLabel">সংখ্যার ধরন (Sequence Pattern)</label>
          <select id="selectPattern" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white font-bold focus:outline-none focus:border-amber-500">
            <option value="asc">ছোট থেকে বড় (Ascending)</option>
            <option value="desc">বড় থেকে ছোট (Descending)</option>
            <option value="mixed">এলোমেলো (Random / Mixed)</option>
          </select>
        </div>

        <!-- Knife Durability -->
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2" id="durabilitySettingLabel">ছুরির স্থায়িত্ব (Knife Durability)</label>
          <select id="selectDurability" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white font-bold focus:outline-none focus:border-amber-500">
            <option value="3">৩ বার ভুল (3 Hits)</option>
            <option value="5" selected>৫ বার ভুল (5 Hits)</option>
            <option value="10">১০ বার ভুল (10 Hits)</option>
          </select>
        </div>

        <!-- Speed Level -->
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2" id="speedSettingLabel">বেলুনের গতি (Speed Level)</label>
          <select id="selectSpeed" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white font-bold focus:outline-none focus:border-amber-500">
            <option value="slow">ধীর (Slow)</option>
            <option value="normal" selected>সাধারণ (Normal)</option>
            <option value="fast">দ্রুত (Fast)</option>
          </select>
        </div>
      </div>

      <div class="mt-5 pt-3 border-t border-slate-800">
        <button id="btnSaveSettings" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold py-3 rounded-xl transition active:scale-95">
          সংরক্ষণ করুন (Save Settings)
        </button>
      </div>
    </div>
  </div>

  <script>
    /* ... existing JavaScript logic with enhanced mobile DPI, Canvas gas balloon vector renderer, touch fixes & TTS ... */
    
    // Bengali Digits Map
    const bnDigits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
    function toBnNum(num) {
      return String(num).replace(/\d/g, d => bnDigits[d]);
    }

    // Bengali Fruit Names Mapping for Gas Balloons
    const fruitNamesBn = ['আম', 'কলা', 'লিচু', 'জাম', 'আনারস', 'কাঁঠাল', 'কমলা', 'আপেল', 'পেয়ারা', 'আতা'];
    const fruitNamesEn = ['Mango', 'Banana', 'Litchi', 'Blackberry', 'Pineapple', 'Jackfruit', 'Orange', 'Apple', 'Guava', 'Custard Apple'];

    // Game Configuration State
    const config = {
      lang: 'bn', // 'bn' or 'en'
      minNum: 1,
      maxNum: 10,
      pattern: 'asc',
      maxDurability: 5,
      speed: 'normal'
    };

    // Translations Dictionary
    const i18n = {
      bn: {
        title: "সংখ্যা শেখা বেলুন খেলা",
        subtitle: "সঠিক সংখ্যার বেলুনটি কেটে সঠিক উত্তর দাও!",
        startBtn: "খেলা শুরু করুন",
        settingsBtn: "সেটিংস পরিবর্তন",
        targetLabel: "খুঁজে বের করো",
        durabilityLabel: "ছুরির ধার:",
        scoreLabel: "স্কোর",
        settingsTitle: "গেমিং সেটিংস",
        langLabel: "ভাষা (Language)",
        rangeLabel: "সংখ্যার সীমা (Number Range)",
        minLabel: "সর্বনিম্ন",
        maxLabel: "সর্বোচ্চ",
        patternLabel: "সংখ্যার ধরন (Sequence Pattern)",
        durabilitySettingLabel: "ছুরির স্থায়িত্ব (Knife Durability)",
        speedLabel: "বেলুনের গতি (Speed Level)",
        saveBtn: "সংরক্ষণ করুন",
        victoryTitle: "দারুণ কাজ!",
        victoryMsg: "তুমি সবকটি বেলুন সঠিকভাবে ফাটিয়েছো!",
        restartBtn: "আবার খেলুন",
        correctSpeech: "একদম ঠিক বেলুনটা ফাটিয়েছো!",
        wrongSpeech: "উফ! ভুল বেলুন কেটেছো!",
        knifeBrokenSpeech: "তোমার ছুরি ভেঙে গেছে! আবার চেষ্টা করো!"
      },
      en: {
        title: "Fruit Ninja Number Learning",
        subtitle: "Slice the balloon with the target number to learn numbers!",
        startBtn: "Start Game",
        settingsBtn: "Settings",
        targetLabel: "Find Number",
        durabilityLabel: "Knife Blades:",
        scoreLabel: "Score",
        settingsTitle: "Game Settings",
        langLabel: "Language",
        rangeLabel: "Number Range",
        minLabel: "Min",
        maxLabel: "Max",
        patternLabel: "Sequence Pattern",
        durabilitySettingLabel: "Knife Durability",
        speedLabel: "Balloon Speed",
        saveBtn: "Save Settings",
        victoryTitle: "Awesome Job!",
        victoryMsg: "You have popped all target balloons correctly!",
        restartBtn: "Play Again",
        correctSpeech: "Awesome! You sliced the right balloon!",
        wrongSpeech: "Oops! That was the wrong balloon!",
        knifeBrokenSpeech: "Your knife broke! Try again!"
      }
    };

    // Canvas & Context Setup with High-DPI Fixes
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let dpr = window.devicePixelRatio || 1;
    let width = 0;
    let height = 0;

    function resizeCanvas() {
      dpr = window.devicePixelRatio || 1;
      width = window.innerWidth;
      height = window.innerHeight;

      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';

      ctx.resetTransform();
      ctx.scale(dpr, dpr);
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Audio & TTS Unlock Strategy
    let audioUnlocked = false;
    let audioCtx = null;

    function unlockAudio() {
      if (audioUnlocked) return;
      audioUnlocked = true;

      // Web Audio API Context
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) {
          audioCtx = new AudioContext();
          if (audioCtx.state === 'suspended') {
            audioCtx.resume();
          }
        }
      } catch (e) {
        console.warn("AudioContext unlock failed:", e);
      }

      // Web Speech Synthesis Warmup
      if ('speechSynthesis' in window) {
        window.speechSynthesis.getVoices();
        const dummyUtterance = new SpeechSynthesisUtterance('');
        dummyUtterance.volume = 0;
        window.speechSynthesis.speak(dummyUtterance);
      }
    }

    ['touchstart', 'touchend', 'pointerdown', 'mousedown', 'keydown'].forEach(evt => {
      window.addEventListener(evt, unlockAudio, { once: true, passive: true });
    });

    // Synthesized Sound Effects
    function playPopSound() {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.12);

        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.12);
      } catch (e){}
    }

    function playWrongSound() {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.25);

        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.25);
      } catch (e){}
    }

    // Bengali Speech Pronunciation for Tens ("এক দশ এক - এগারো")
    function generateBengaliPronunciation(num) {
      if (num < 10 || num > 99) return toBnNum(num);
      const tensNames = ['', 'এক দশ', 'দুই দশ', 'তিন দশ', 'চার দশ', 'পাঁচ দশ', 'ছয় দশ', 'সাত দশ', 'আট দশ', 'নয় দশ'];
      const tens = Math.floor(num / 10);
      const units = num % 10;
      const tensPrefix = tensNames[tens];
      
      if (units === 0) return `${tensPrefix} - ${toBnNum(num)}`;
      return `${tensPrefix} ${toBnNum(units)} - ${toBnNum(num)}`;
    }

    // Speech TTS Handler
    function speakText(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = config.lang === 'bn' ? 'bn-BD' : 'en-US';
      utterance.rate = 0.9;
      
      const voices = window.speechSynthesis.getVoices();
      const matchVoice = voices.find(v => v.lang.startsWith(config.lang === 'bn' ? 'bn' : 'en'));
      if (matchVoice) utterance.voice = matchVoice;

      window.speechSynthesis.speak(utterance);
    }

    // Dynamic Banner Display
    let bannerTimeout = null;
    function showSpeechBanner(text) {
      const banner = document.getElementById('speechBanner');
      const bannerText = document.getElementById('speechBannerText');
      bannerText.innerText = text;

      banner.classList.remove('opacity-0', '-translate-y-8');
      banner.classList.add('opacity-100', 'translate-y-0');

      if (bannerTimeout) clearTimeout(bannerTimeout);
      bannerTimeout = setTimeout(() => {
        banner.classList.remove('opacity-100', 'translate-y-0');
        banner.classList.add('opacity-0', '-translate-y-8');
      }, 2500);
    }

    // Game State Variable Definition
    let currentScore = 0;
    let currentDurability = 5;
    let gameActive = false;
    let sequenceList = [];
    let sequenceIndex = 0;
    let currentTargetNum = 1;

    let balloons = [];
    let particles = [];
    let sliceTrail = [];
    let isSlicing = false;
    let lastSlicePos = { x: 0, y: 0 };

    // Mascot & Bottom Launching Monkeys
    const mascot = {
      x: 0,
      y: 0,
      blinkTimer: 0,
      isBlinking: false,
      danceTimer: 0
    };

    const launcherMonkeys = [
      { xPct: 0.18, offset: 0 },
      { xPct: 0.50, offset: 1.5 },
      { xPct: 0.82, offset: 3.0 }
    ];

    // Metallic Gas Balloon Colors
    const balloonPalette = [
      { main: '#ff2a6d', dark: '#b3003b', light: '#ff85a2' }, // Pink/Red
      { main: '#05d54c', dark: '#00802b', light: '#73f59d' }, // Neon Green
      { main: '#00f5d4', dark: '#009985', light: '#80faf0' }, // Turquoise
      { main: '#7b2cbf', dark: '#4a127a', light: '#c084fc' }, // Purple
      { main: '#ff9e00', dark: '#b36e00', light: '#ffca73' }, // Bright Amber
      { main: '#00b4d8', dark: '#00667a', light: '#90e0ef' }  // Deep Cyan
    ];

    // Balloon Vector Graphics Renderer (Pure Canvas, Zero SVG/Image Dependency)
    class GasBalloon {
      constructor(number, isTarget) {
        this.number = number;
        this.isTarget = isTarget;
        
        // Random placement across canvas width with safe padding
        this.radius = Math.min(width, height) * 0.065 + Math.random() * 8;
        if (this.radius < 38) this.radius = 38;

        this.x = Math.random() * (width - this.radius * 2.5) + this.radius * 1.25;
        this.y = height + this.radius * 2;

        // Upward gas float speed based on settings
        let speedMult = config.speed === 'slow' ? 0.7 : (config.speed === 'fast' ? 1.4 : 1.0);
        this.vy = -(Math.random() * 1.8 + 2.2) * speedMult;
        this.vx = (Math.random() - 0.5) * 0.8;

        // Sway motion variables
        this.swayAngle = Math.random() * Math.PI * 2;
        this.swaySpeed = 0.02 + Math.random() * 0.02;

        // Visual Palette & Fruit Name
        this.palette = balloonPalette[Math.floor(Math.random() * balloonPalette.length)];
        const fruitIdx = Math.floor(Math.random() * fruitNamesBn.length);
        this.fruitBn = fruitNamesBn[fruitIdx];
        this.fruitEn = fruitNamesEn[fruitIdx];

        this.popped = false;
      }

      update() {
        this.y += this.vy;
        this.swayAngle += this.swaySpeed;
        this.x += Math.sin(this.swayAngle) * 0.9 + this.vx;
      }

      draw(ctx) {
        if (this.popped) return;

        ctx.save();
        ctx.translate(this.x, this.y);

        // 1. Draw Wavy String attached at bottom
        ctx.beginPath();
        ctx.moveTo(0, this.radius * 1.1);
        const waveX = Math.sin(this.swayAngle * 2) * 10;
        ctx.quadraticCurveTo(waveX, this.radius * 1.8, waveX / 2, this.radius * 2.6);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
        ctx.lineWidth = 2;
        ctx.stroke();

        // 2. Draw Gas Balloon Body (Teardrop / Oval Path)
        ctx.beginPath();
        ctx.moveTo(0, this.radius * 1.1);
        // Left side curve
        ctx.bezierCurveTo(
          -this.radius * 1.2, this.radius * 0.7,
          -this.radius * 1.1, -this.radius * 1.1,
          0, -this.radius
        );
        // Right side curve
        ctx.bezierCurveTo(
          this.radius * 1.1, -this.radius * 1.1,
          this.radius * 1.2, this.radius * 0.7,
          0, this.radius * 1.1
        );
        ctx.closePath();

        // Shiny Radial Metallic Gradient
        const grad = ctx.createRadialGradient(
          -this.radius * 0.3, -this.radius * 0.3, this.radius * 0.1,
          0, 0, this.radius * 1.2
        );
        grad.addColorStop(0, this.palette.light);
        grad.addColorStop(0.4, this.palette.main);
        grad.addColorStop(1, this.palette.dark);

        ctx.fillStyle = grad;
        ctx.fill();

        // Balloon Bottom Knot
        ctx.beginPath();
        ctx.moveTo(-6, this.radius * 1.08);
        ctx.lineTo(6, this.radius * 1.08);
        ctx.lineTo(9, this.radius * 1.22);
        ctx.lineTo(-9, this.radius * 1.22);
        ctx.closePath();
        ctx.fillStyle = this.palette.dark;
        ctx.fill();

        // Glossy Top-Left Specular Highlight
        ctx.beginPath();
        ctx.ellipse(
          -this.radius * 0.35, -this.radius * 0.45,
          this.radius * 0.28, this.radius * 0.14,
          -Math.PI / 4, 0, Math.PI * 2
        );
        ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
        ctx.fill();

        // 3. Central Fruit Name Tag
        ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
        ctx.beginPath();
        ctx.roundRect(-this.radius * 0.65, -this.radius * 0.55, this.radius * 1.3, this.radius * 0.38, 8);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.font = `bold ${Math.floor(this.radius * 0.24)}px "Hind Siliguri", sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const fruitText = config.lang === 'bn' ? this.fruitBn : this.fruitEn;
        ctx.fillText(fruitText, 0, -this.radius * 0.36);

        // 4. Vibrant Dual Number Badge Overlay
        const badgeR = this.radius * 0.42;
        ctx.beginPath();
        ctx.arc(0, this.radius * 0.18, badgeR, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = 'rgba(0,0,0,0.4)';
        ctx.shadowBlur = 6;
        ctx.fill();
        ctx.shadowBlur = 0;

        ctx.strokeStyle = this.palette.dark;
        ctx.lineWidth = 3;
        ctx.stroke();

        // Render Bengali & English Dual Badge
        const bnStr = toBnNum(this.number);
        const enStr = String(this.number);

        ctx.fillStyle = '#0f172a';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        if (config.lang === 'bn') {
          ctx.font = `black ${Math.floor(badgeR * 1.1)}px "Hind Siliguri", sans-serif`;
          ctx.fillText(bnStr, 0, this.radius * 0.14);

          ctx.font = `bold ${Math.floor(badgeR * 0.55)}px "Inter", sans-serif`;
          ctx.fillStyle = '#64748b';
          ctx.fillText(`(${enStr})`, 0, this.radius * 0.36);
        } else {
          ctx.font = `black ${Math.floor(badgeR * 1.1)}px "Inter", sans-serif`;
          ctx.fillText(enStr, 0, this.radius * 0.14);

          ctx.font = `bold ${Math.floor(badgeR * 0.55)}px "Hind Siliguri", sans-serif`;
          ctx.fillStyle = '#64748b';
          ctx.fillText(`(${bnStr})`, 0, this.radius * 0.36);
        }

        ctx.restore();
      }
    }

    // Particle Burst Effect on Slice
    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.radius = Math.random() * 5 + 3;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 7 + 2;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.alpha = 1;
        this.decay = Math.random() * 0.03 + 0.015;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.15; // Gravity
        this.alpha -= this.decay;
      }

      draw(ctx) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    // Spawn Burst of Particles
    function spawnPopParticles(x, y, color) {
      for (let i = 0; i < 22; i++) {
        particles.push(new Particle(x, y, color));
      }
    }

    // Draw Main Mascot Monkey (Top-Left / Centered Side)
    function drawMascot(ctx, time) {
      mascot.x = width * 0.12;
      mascot.y = height * 0.18;

      ctx.save();
      ctx.translate(mascot.x, mascot.y);

      // Bounce/Dance offset if celebrating correct pop
      let danceY = 0;
      if (mascot.danceTimer > 0) {
        mascot.danceTimer--;
        danceY = Math.sin(time * 0.02) * 12;
      }

      ctx.translate(0, danceY);

      // Ears
      ctx.fillStyle = '#8d5524';
      ctx.beginPath();
      ctx.arc(-26, -10, 14, 0, Math.PI * 2);
      ctx.arc(26, -10, 14, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#ffdbac';
      ctx.beginPath();
      ctx.arc(-26, -10, 8, 0, Math.PI * 2);
      ctx.arc(26, -10, 8, 0, Math.PI * 2);
      ctx.fill();

      // Head
      ctx.fillStyle = '#8d5524';
      ctx.beginPath();
      ctx.arc(0, 0, 28, 0, Math.PI * 2);
      ctx.fill();

      // Face patch
      ctx.fillStyle = '#ffdbac';
      ctx.beginPath();
      ctx.ellipse(0, 4, 20, 16, 0, 0, Math.PI * 2);
      ctx.fill();

      // Eyes (with constant blinking timer)
      mascot.blinkTimer++;
      if (mascot.blinkTimer > 180) {
        mascot.isBlinking = true;
        if (mascot.blinkTimer > 192) {
          mascot.isBlinking = false;
          mascot.blinkTimer = 0;
        }
      }

      ctx.fillStyle = '#0f172a';
      if (mascot.isBlinking) {
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-12, -4); ctx.lineTo(-4, -4);
        ctx.moveTo(4, -4); ctx.lineTo(12, -4);
        ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.arc(-8, -4, 4, 0, Math.PI * 2);
        ctx.arc(8, -4, 4, 0, Math.PI * 2);
        ctx.fill();
      }

      // Snout / Smile
      ctx.beginPath();
      ctx.arc(0, 8, 3, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.arc(0, 10, 8, 0.1 * Math.PI, 0.9 * Math.PI);
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = '#0f172a';
      ctx.stroke();

      ctx.restore();
    }

    // Draw Bottom Monkeys Launching Balloons
    function drawLauncherMonkeys(ctx, time) {
      launcherMonkeys.forEach((m) => {
        const x = width * m.xPct;
        const y = height - 10;
        const armWave = Math.sin(time * 0.004 + m.offset) * 8;

        ctx.save();
        ctx.translate(x, y);

        // Body
        ctx.fillStyle = '#78350f';
        ctx.beginPath();
        ctx.arc(0, 0, 24, Math.PI, 0);
        ctx.fill();

        // Arms up launching gas balloons
        ctx.strokeStyle = '#78350f';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(-16, -10);
        ctx.lineTo(-24, -30 + armWave);
        ctx.moveTo(16, -10);
        ctx.lineTo(24, -30 - armWave);
        ctx.stroke();

        // Monkey Head
        ctx.fillStyle = '#92400e';
        ctx.beginPath();
        ctx.arc(0, -22, 16, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#fde68a';
        ctx.beginPath();
        ctx.arc(0, -18, 10, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      });
    }

    // Knife Slice Trail & Trajectory Particle Effects
    function drawSliceTrail(ctx) {
      if (sliceTrail.length < 2) return;

      ctx.save();
      for (let i = 1; i < sliceTrail.length; i++) {
        const pt1 = sliceTrail[i - 1];
        const pt2 = sliceTrail[i];
        const progress = i / sliceTrail.length;

        ctx.beginPath();
        ctx.moveTo(pt1.x, pt1.y);
        ctx.lineTo(pt2.x, pt2.y);
        ctx.strokeStyle = `rgba(56, 189, 248, ${progress})`;
        ctx.lineWidth = progress * 7;
        ctx.lineCap = 'round';
        ctx.shadowColor = '#38bdf8';
        ctx.shadowBlur = 10;
        ctx.stroke();
      }
      ctx.restore();
    }

    // Update Blade Trail Coordinates
    function updateSliceTrail() {
      for (let i = 0; i < sliceTrail.length; i++) {
        sliceTrail[i].life -= 0.08;
      }
      sliceTrail = sliceTrail.filter(p => p.life > 0);
    }

    // Sequence Generator for Game
    function generateSequence() {
      sequenceList = [];
      const min = config.minNum;
      const max = config.maxNum;

      for (let i = min; i <= max; i++) {
        sequenceList.push(i);
      }

      if (config.pattern === 'desc') {
        sequenceList.reverse();
      } else if (config.pattern === 'mixed') {
        // Shuffle array
        for (let i = sequenceList.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [sequenceList[i], sequenceList[j]] = [sequenceList[j], sequenceList[i]];
        }
      }

      sequenceIndex = 0;
      currentTargetNum = sequenceList[0];
      updateHUDTarget();
    }

    function updateHUDTarget() {
      const bnText = toBnNum(currentTargetNum);
      const enText = String(currentTargetNum);
      document.getElementById('targetDisplay').innerText = config.lang === 'bn' ? `${bnText} (${enText})` : `${enText} (${bnText})`;
    }

    // Durability HUD Update
    function updateDurabilityHUD() {
      const container = document.getElementById('knifeDurabilityIcons');
      container.innerHTML = '';

      for (let i = 0; i < config.maxDurability; i++) {
        const icon = document.createElement('i');
        if (i < currentDurability) {
          icon.className = 'fas fa-shield-alt text-amber-400 text-sm';
        } else {
          icon.className = 'fas fa-shield-alt text-slate-600 text-sm opacity-40';
        }
        container.appendChild(icon);
      }
    }

    // Spawn Balloons Logic
    let spawnTimer = 0;
    function handleBalloonSpawning() {
      spawnTimer++;
      if (spawnTimer > 75) {
        spawnTimer = 0;

        if (balloons.length < 6) {
          // Determine if target balloon should spawn
          const targetExists = balloons.some(b => b.number === currentTargetNum);
          let spawnNum = currentTargetNum;

          if (targetExists || Math.random() > 0.4) {
            // Spawn random non-target number
            const range = config.maxNum - config.minNum + 1;
            spawnNum = Math.floor(Math.random() * range) + config.minNum;
          }

          balloons.push(new GasBalloon(spawnNum, spawnNum === currentTargetNum));
        }
      }
    }

    // Check Slicing Collision with Balloons
    function checkSlicingCollision(x, y) {
      if (!isSlicing || !gameActive) return;

      balloons.forEach((b) => {
        if (!b.popped) {
          const dist = Math.hypot(b.x - x, b.y - y);
          if (dist < b.radius * 1.1) {
            b.popped = true;

            if (b.number === currentTargetNum) {
              // Correct Balloon Popped!
              playPopSound();
              spawnPopParticles(b.x, b.y, b.palette.main);
              currentScore += 10;
              document.getElementById('scoreDisplay').innerText = config.lang === 'bn' ? toBnNum(currentScore) : currentScore;

              mascot.danceTimer = 40;

              // Voice Pronunciation
              const pron = config.lang === 'bn' ? generateBengaliPronunciation(currentTargetNum) : String(currentTargetNum);
              const fb = i18n[config.lang].correctSpeech;
              showSpeechBanner(`${pron} - ${fb}`);
              speakText(`${pron}. ${fb}`);

              // Move to next in sequence
              sequenceIndex++;
              if (sequenceIndex < sequenceList.length) {
                currentTargetNum = sequenceList[sequenceIndex];
                updateHUDTarget();
              } else {
                // Game Victory!
                setTimeout(showVictory, 800);
              }

            } else {
              // Wrong Balloon Sliced!
              playWrongSound();
              spawnPopParticles(b.x, b.y, '#ef4444');
              currentDurability--;
              updateDurabilityHUD();

              const wrongFb = i18n[config.lang].wrongSpeech;
              showSpeechBanner(wrongFb);
              speakText(wrongFb);

              if (currentDurability <= 0) {
                // Knife Durability Broken / Game Over
                setTimeout(() => {
                  alert(i18n[config.lang].knifeBrokenSpeech);
                  resetGame();
                }, 400);
              }
            }
          }
        }
      });
    }

    // Mobile & Desktop Unified Touch/Pointer Events
    function handlePointerStart(x, y) {
      unlockAudio();
      isSlicing = true;
      lastSlicePos = { x, y };
      sliceTrail.push({ x, y, life: 1.0 });
      checkSlicingCollision(x, y);
    }

    function handlePointerMove(x, y) {
      if (!isSlicing) return;
      sliceTrail.push({ x, y, life: 1.0 });
      checkSlicingCollision(x, y);
      lastSlicePos = { x, y };
    }

    function handlePointerEnd() {
      isSlicing = false;
    }

    // Prevent scrolling / pull-to-refresh on touches
    window.addEventListener('touchstart', (e) => {
      const touch = e.touches[0];
      if (touch) handlePointerStart(touch.clientX, touch.clientY);
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      e.preventDefault(); // Stop iOS/Android pull down scroll
      const touch = e.touches[0];
      if (touch) handlePointerMove(touch.clientX, touch.clientY);
    }, { passive: false });

    window.addEventListener('touchend', () => handlePointerEnd(), { passive: false });
    window.addEventListener('touchcancel', () => handlePointerEnd(), { passive: false });

    // Pointer Event Fallbacks
    canvas.addEventListener('pointerdown', (e) => handlePointerStart(e.clientX, e.clientY));
    canvas.addEventListener('pointermove', (e) => handlePointerMove(e.clientX, e.clientY));
    canvas.addEventListener('pointerup', () => handlePointerEnd());

    // Main Canvas Render & Animation Loop
    let animTime = 0;
    function gameLoop(time) {
      animTime = time;
      ctx.clearRect(0, 0, width, height);

      if (gameActive) {
        // 1. Spawning
        handleBalloonSpawning();

        // 2. Update & Draw Balloons
        for (let i = balloons.length - 1; i >= 0; i--) {
          const b = balloons[i];
          b.update();
          b.draw(ctx);

          // Remove offscreen balloons
          if (b.y < -b.radius * 3 || b.popped) {
            balloons.splice(i, 1);
          }
        }

        // 3. Update & Draw Particles
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.update();
          p.draw(ctx);
          if (p.alpha <= 0) particles.splice(i, 1);
        }

        // 4. Update & Draw Blade Slicing Trail
        updateSliceTrail();
        drawSliceTrail(ctx);
      }

      // 5. Draw Decorative Game Elements
      drawMascot(ctx, animTime);
      drawLauncherMonkeys(ctx, animTime);

      requestAnimationFrame(gameLoop);
    }

    // Game Control Actions
    function startGame() {
      currentScore = 0;
      currentDurability = config.maxDurability;
      balloons = [];
      particles = [];
      document.getElementById('scoreDisplay').innerText = config.lang === 'bn' ? '০' : '0';
      
      updateDurabilityHUD();
      generateSequence();

      document.getElementById('startOverlay').classList.add('hidden');
      document.getElementById('victoryModal').classList.add('hidden');
      gameActive = true;
    }

    function resetGame() {
      gameActive = false;
      document.getElementById('startOverlay').classList.remove('hidden');
    }

    function showVictory() {
      gameActive = false;
      document.getElementById('victoryModal').classList.remove('hidden');
      speakText(i18n[config.lang].victoryMsg);
    }

    // UI Localizer
    function applyLocalization() {
      const txt = i18n[config.lang];
      document.getElementById('gameTitle').innerText = txt.title;
      document.getElementById('gameSubtitle').innerText = txt.subtitle;
      document.getElementById('btnStartText').innerText = txt.startBtn;
      document.getElementById('btnSettingsText').innerText = txt.settingsBtn;
      document.getElementById('targetLabel').innerText = txt.targetLabel;
      document.getElementById('durabilityLabel').innerText = txt.durabilityLabel;
      document.getElementById('scoreLabel').innerText = txt.scoreLabel;
      document.getElementById('settingsTitle').innerText = txt.settingsTitle;
      document.getElementById('langSettingLabel').innerText = txt.langLabel;
      document.getElementById('rangeSettingLabel').innerText = txt.rangeLabel;
      document.getElementById('minNumLabel').innerText = txt.minLabel;
      document.getElementById('maxNumLabel').innerText = txt.maxLabel;
      document.getElementById('patternSettingLabel').innerText = txt.patternLabel;
      document.getElementById('durabilitySettingLabel').innerText = txt.durabilitySettingLabel;
      document.getElementById('speedSettingLabel').innerText = txt.speedLabel;
      document.getElementById('btnSaveSettings').innerText = txt.saveBtn;
      document.getElementById('victoryTitle').innerText = txt.victoryTitle;
      document.getElementById('victoryMsg').innerText = txt.victoryMsg;
      document.getElementById('btnRestartText').innerText = txt.restartBtn;

      // Update Language Buttons
      if (config.lang === 'bn') {
        document.getElementById('langBnBtn').className = 'py-2.5 rounded-xl font-bold border border-amber-500 bg-amber-500/20 text-amber-300';
        document.getElementById('langEnBtn').className = 'py-2.5 rounded-xl font-bold border border-slate-700 bg-slate-800 text-slate-400';
      } else {
        document.getElementById('langEnBtn').className = 'py-2.5 rounded-xl font-bold border border-amber-500 bg-amber-500/20 text-amber-300';
        document.getElementById('langBnBtn').className = 'py-2.5 rounded-xl font-bold border border-slate-700 bg-slate-800 text-slate-400';
      }

      updateHUDTarget();
    }

    // Settings Modal Bindings
    document.getElementById('btnSettings').addEventListener('click', () => {
      document.getElementById('settingsModal').classList.remove('hidden');
    });

    document.getElementById('btnOpenSettingsInit').addEventListener('click', () => {
      document.getElementById('settingsModal').classList.remove('hidden');
    });

    document.getElementById('btnCloseSettings').addEventListener('click', () => {
      document.getElementById('settingsModal').classList.add('hidden');
    });

    document.getElementById('langBnBtn').addEventListener('click', () => {
      config.lang = 'bn';
      applyLocalization();
    });

    document.getElementById('langEnBtn').addEventListener('click', () => {
      config.lang = 'en';
      applyLocalization();
    });

    document.getElementById('btnSaveSettings').addEventListener('click', () => {
      config.minNum = parseInt(document.getElementById('inputMinNum').value) || 1;
      config.maxNum = parseInt(document.getElementById('inputMaxNum').value) || 10;
      config.pattern = document.getElementById('selectPattern').value;
      config.maxDurability = parseInt(document.getElementById('selectDurability').value) || 5;
      config.speed = document.getElementById('selectSpeed').value;

      document.getElementById('settingsModal').classList.add('hidden');
      applyLocalization();
      if (gameActive) startGame();
    });

    document.getElementById('btnStartGame').addEventListener('click', startGame);
    document.getElementById('btnRestartVictory').addEventListener('click', startGame);

    // Initialize Canvas Loop on Window Load
    window.onload = function () {
      applyLocalization();
      requestAnimationFrame(gameLoop);
    };
  </script>
</body>
