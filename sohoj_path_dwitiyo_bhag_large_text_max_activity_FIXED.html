function words(){let g=$("wordGrid");g.innerHTML="";L().words.forEach(w=>{let d=document.createElement("div");d.className="word";d.innerHTML="<b>"+w[0]+"</b><p>"+w[1]+"</p><button>🔊 শুনি</button>";d.querySelector("button").onclick=()=>speak(w[0]);g.appendChild(d)})}
document.querySelectorAll(".act").forEach(b=>b.onclick=()=>{act=b.dataset.act;idx=score=0;document.querySelectorAll(".act").forEach(x=>x.classList.toggle("active",x===b));game()});
function meaningQs(reverse=false){let w=L().words;return w.map(a=>{let pool=sh(w.filter(x=>x[0]!==a[0]));return reverse?[a[1],a[0],sh([a[0],...pool.slice(0,3).map(x=>x[0])])]:["“"+a[0]+"” শব্দের অর্থ কী?",a[1],sh([a[1],...pool.slice(0,3).map(x=>x[1])])]})}
function tfQs(){let w=L().words,out=[];w.forEach((a,i)=>{out.push([a[0]+" শব্দের অর্থ “"+a[1]+"”।","সত্য",["সত্য","মিথ্যা"]]);let wrong=w[(i+1)%w.length][1];out.push([a[0]+" শব্দের অর্থ “"+wrong+"”।","মিথ্যা",["সত্য","মিথ্যা"]])});return sh(out)}
function fillQs(){let qs=[[L().fill.text,L().fill.answer,L().fill.options]];L().lines.forEach(line=>{let found=L().words.find(w=>line.includes(w[0]));if(found){let q=line.replace(found[0],"___"),others=sh(L().words.filter(x=>x[0]!==found[0]).map(x=>x[0])).slice(0,3);qs.push([q,found[0],sh([found[0],...others])])}});return qs}
function qset(){
  if(act==="comp") return L().quiz.map(q=>{
    if(Array.isArray(q)) return [q[0],q[1],q[2]];
    return [q.q,q.opts[q.ans],q.opts];
  });
  if(act==="meaning")return meaningQs(false);
  if(act==="reverse")return meaningQs(true);
  if(act==="tf")return tfQs();
  if(act==="fill")return fillQs();
  return[];
}
function quiz(){let qs=qset();if(idx>=qs.length){$("game").innerHTML='<div style="text-align:center;font-size:4rem">🏆</div><h3>Activity complete!</h3><div class="sub">স্কোর '+bn(score)+' / '+bn(qs.length)+'</div><div class="buttons"><button class="primary" id="again">আবার খেলি</button></div>';$("again").onclick=()=>{idx=score=0;quiz()};return}let q=qs[idx];$("game").innerHTML='<h3>🎯 অনুশীলন</h3><div class="progress"><div class="bar" style="width:'+(idx/qs.length*100)+'%"></div></div><div class="sub">প্রশ্ন '+bn(idx+1)+' / '+bn(qs.length)+'</div><div class="q">'+q[0]+'</div><div class="choices" id="choices"></div><div class="status" id="status"></div>';sh(q[2]).forEach(o=>{let b=document.createElement("button");b.className="choice";b.textContent=o;b.onclick=()=>{document.querySelectorAll(".choice").forEach(x=>x.disabled=true);if(o===q[1]){b.classList.add("good");score++;addStar();$("status").textContent="✅ ঠিক!"}else{b.classList.add("bad");$("status").textContent="সঠিক উত্তর: "+q[1]}setTimeout(()=>{idx++;quiz()},800)};$("choices").appendChild(b)})}
function order(){let text=L().lines[idx%L().lines.length].split(/[।?!]/)[0].trim(),ws=text.split(/\s+/).slice(0,10),ans=[];$("game").innerHTML='<h3>🧩 বাক্য সাজাও</h3><div class="sub">শব্দগুলিকে সঠিক ক্রমে সাজাও</div><div class="areas answer" id="ans"></div><div class="areas pool" id="pool"></div><div class="buttons"><button class="primary" id="check">✓ মিলিয়ে দেখি</button><button class="light" id="reset">↺ আবার</button><button class="light" id="new">অন্য বাক্য</button></div><div class="status" id="status"></div>';sh(ws.map((w,i)=>({w,i}))).forEach(o=>{let b=document.createElement("button");b.className="chip";b.textContent=o.w;b.onclick=()=>{ans.push(o);$("ans").appendChild(b)};$("pool").appendChild(b)});$("check").onclick=()=>{let ok=ans.map(x=>x.w).join(" ")===ws.join(" ");$("status").textContent=ok?"✅ একদম ঠিক!":"❌ আবার সাজাও";if(ok)addStar(2)};$("reset").onclick=order;$("new").onclick=()=>{idx++;order()}}
function match(){let w=sh(L().words).slice(0,6);leftSel=rightSel=null;$("game").innerHTML='<h3>🔗 শব্দ ও অর্থ মিলাও</h3><div class="sub">একটি শব্দ এবং তার সঠিক অর্থ ট্যাপ করো</div><div class="pairGrid"><div class="col" id="left"></div><div class="col" id="right"></div></div><div class="status" id="status"></div>';sh(w).forEach(a=>mkPair("left",a[0],a[0],"L"));sh(w).forEach(a=>mkPair("right",a[1],a[0],"R"))}
function mkPair(col,text,key,side){let b=document.createElement("button");b.className="pair";b.textContent=text;b.onclick=()=>{document.querySelectorAll("#"+col+" .pair:not(.matched)").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");if(side==="L")leftSel={b,key};else rightSel={b,key};if(leftSel&&rightSel){if(leftSel.key===rightSel.key){leftSel.b.classList.add("matched");rightSel.b.classList.add("matched");leftSel.b.disabled=rightSel.b.disabled=true;addStar();$("status").textContent="✅ মিলেছে!"}else $("status").textContent="❌ মিলেনি";leftSel.b.classList.remove("sel");rightSel.b.classList.remove("sel");leftSel=rightSel=null}};$(col).appendChild(b)}
function listenGame(){let w=L().words,q=w[idx%w.length],opts=sh([q[0],...sh(w.filter(x=>x[0]!==q[0]).map(x=>x[0])).slice(0,3)]);$("game").innerHTML='<h3>👂 শুনে শব্দ চেনো</h3><div class="sub">🔊 চাপ দিয়ে শুনে সঠিক শব্দ ট্যাপ করো</div><div class="q"><button class="voice" id="play">🔊 শব্দ শুনি</button></div><div class="choices" id="choices"></div><div class="status" id="status"></div>';$("play").onclick=()=>speak(q[0]);opts.forEach(o=>{let b=document.createElement("button");b.className="choice";b.textContent=o;b.onclick=()=>{if(o===q[0]){b.classList.add("good");addStar();$("status").textContent="✅ ঠিক!";setTimeout(()=>{idx++;listenGame()},800)}else{b.classList.add("bad");$("status").textContent="আবার শুনে চেষ্টা করো"}};$("choices").appendChild(b)});setTimeout(()=>$("play").click(),250)}
function spell(){let q=L().words[idx%L().words.length],word=q[0].replace(/\s/g,""),chs=[...word];spellAns=[];$("game").innerHTML='<h3>🔠 শব্দ গড়ি</h3><div class="sub">অর্থ: '+q[1]+'</div><div class="spell" id="spell"></div><div class="letters" id="letters"></div><div class="buttons"><button class="primary" id="check">✓ মিলিয়ে দেখি</button><button class="light" id="reset">↺ আবার</button><button class="light" id="new">অন্য শব্দ</button></div><div class="status" id="status"></div>';sh(chs.map((c,i)=>({c,i}))).forEach(o=>{let b=document.createElement("button");b.className="letter";b.textContent=o.c;b.onclick=()=>{spellAns.push(o);$("spell").appendChild(b)};$("letters").appendChild(b)});$("check").onclick=()=>{let ok=spellAns.map(x=>x.c).join("")===word;$("status").textContent=ok?"✅ শব্দটি ঠিক!":"❌ অক্ষরের ক্রম আবার দেখো";if(ok)addStar(2)};$("reset").onclick=spell;$("new").onclick=()=>{idx++;spell()}}
function game(){if(["comp","meaning","reverse","tf","fill"].includes(act))quiz();else if(act==="order")order();else if(act==="match")match();else if(act==="listen")listenGame();else spell()}
function bank(){
  let l=L(),arr=[];
  l.quiz.forEach((q,i)=>{
    if(Array.isArray(q)) arr.push(["বোঝার প্রশ্ন "+bn(i+1),q[0],q[1]]);
    else arr.push(["বোঝার প্রশ্ন "+bn(i+1),q.q,q.opts[q.ans]]);
  });
  meaningQs(false).forEach((q,i)=>arr.push(["শব্দার্থ "+bn(i+1),q[0],q[1]]));
  meaningQs(true).forEach((q,i)=>arr.push(["অর্থ থেকে শব্দ "+bn(i+1),q[0]+" — কোন শব্দ?",q[1]]));
  tfQs().forEach((q,i)=>arr.push(["সত্য/মিথ্যা "+bn(i+1),q[0],q[1]]));
  fillQs().forEach((q,i)=>arr.push(["শূন্যস্থান "+bn(i+1),q[0],q[1]]));
  $("bankSummary").textContent="এই পাঠে মোট "+bn(arr.length)+"টি প্রশ্ন";
  let b=$("bankList");b.innerHTML="";
  arr.forEach(q=>{
    let d=document.createElement("div");
    d.className="bankItem";
    d.innerHTML="<b>"+q[0]+"</b><div style='margin-top:5px'>"+q[1]+"</div><button>উত্তর দেখাও</button><div class='ans'>উত্তর: "+q[2]+"</div>";
    d.querySelector("button").onclick=()=>d.classList.toggle("show");
    b.appendChild(d);
  });
}
$("showAll").onclick=()=>document.querySelectorAll(".bankItem").forEach(x=>x.classList.add("show"));$("hideAll").onclick=()=>document.querySelectorAll(".bankItem").forEach(x=>x.classList.remove("show"));load();
</script></body></html>
